name: Copyright

on:
  pull_request:
    branches: [main, phase-1, phase-2]
  push:
    branches: [main, phase-1, phase-2]

jobs:
  copyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed source files
        shell: bash
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          fi
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- app backend | grep -E '\.(kt|kts|java|js|ts|tsx|sql|xml)$' || true)
          if [[ "${#files[@]}" -gt 0 ]]; then
            bash scripts/check-copyright.sh "${files[@]}"
          else
            echo "No changed source files to check."
          fi
